<div class="xz-authbd" (click)="close()">
  <div class="xz-auth" role="dialog" aria-modal="true" aria-labelledby="xz-auth-title" (click)="$event.stopPropagation()">
    <div class="xz-auth-h">
      <div class="xz-auth-ht">
        <span class="xz-auth-step">Step 1 of 2</span>
        <h2 id="xz-auth-title">Create your account</h2>
      </div>
      <button type="button" class="xz-auth-x" aria-label="Close" (click)="close()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="xz-auth-b">
      <p class="xz-auth-sub">One account per business. Your customers never see it.</p>

      @for (p of providers(); track p.idp) {
        <button type="button" class="xz-auth-p" [class.xz-busy]="redirecting() === p.idp"
                [attr.aria-busy]="redirecting() === p.idp" (click)="choose(p)">
          @if (showLogo(p)) {
            <img class="xz-auth-pl" [src]="p.logoSrc" alt="" (error)="onLogoError(p)">
          } @else if (p.brand === 'google') {
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          } @else if (p.brand === 'microsoft') {
            <svg viewBox="0 0 23 23" aria-hidden="true">
              <path fill="#F25022" d="M1 1h10v10H1z"/>
              <path fill="#7FBA00" d="M12 1h10v10H12z"/>
              <path fill="#00A4EF" d="M1 12h10v10H1z"/>
              <path fill="#FFB900" d="M12 12h10v10H12z"/>
            </svg>
          } @else if (p.brand === 'apple') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M16.365 1.43c0 1.14-.42 2.2-1.13 3.02-.85.98-2.24 1.74-3.4 1.65-.14-1.1.42-2.26 1.1-3.01.78-.87 2.15-1.53 3.43-1.66zM20.5 17.1c-.6 1.37-.89 1.98-1.66 3.19-1.08 1.69-2.6 3.79-4.48 3.81-1.67.02-2.1-1.09-4.37-1.08-2.27.01-2.74 1.1-4.41 1.08-1.88-.02-3.32-1.92-4.4-3.6C-1.5 16.05-1.83 9.6.9 6.36c1.2-1.44 2.9-2.28 4.5-2.28 1.63 0 2.65 1.09 4 1.09 1.31 0 2.11-1.09 4-1.09 1.42 0 2.93.78 4 2.12-3.52 1.93-2.95 6.96.6 8.4z"/>
            </svg>
          } @else if (p.brand === 'linkedin') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#0A66C2" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
            </svg>
          } @else {
            <span class="xz-auth-pi" aria-hidden="true">{{ p.initial }}</span>
          }
          Continue with {{ p.displayName }}
        </button>
      }

      @if (providers().length) {
        <div class="xz-auth-or">or</div>
      }

      <input type="email" class="xz-auth-in" placeholder="you@company.com" autocomplete="email" aria-label="Work email">
      <button type="button" class="xz-auth-go">Email me a link</button>

      <p class="xz-auth-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v6c0 4.4-3.4 7.4-8 8-4.6-.6-8-3.6-8-8V7z"/></svg>
        <span>Demo only — nothing is sent and no account is created. Choosing a provider just moves you to the next step.</span>
      </p>
    </div>
  </div>
</div>
