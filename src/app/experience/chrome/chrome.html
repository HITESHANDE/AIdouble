<header class="xz-chrome">
  <div class="wrap xz-chrome-in">
    <a routerLink="/" class="xz-logo"><span class="xz-dot" aria-hidden="true"></span><em>{{ displayName() }}</em></a>
    <span class="xz-zonetag">Experience Zone</span>
    <span style="flex:1"></span>
    <div class="xz-chrome-r">
      <div class="xz-regionsel">
        <button type="button" class="xz-regionbtn" (click)="toggleMenu($event)" [attr.aria-expanded]="menuOpen()">
          <span class="fl">{{ region().flag }}</span><span>{{ region().name }}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="xz-regionmenu" [class.open]="menuOpen()" role="menu">
          @for (r of regions; track r.id) {
            <button type="button" role="menuitem" [class.on]="r.id === region().id" (click)="selectRegion(r)">
              <span>{{ r.flag }}</span>{{ r.name }}
            </button>
          }
        </div>
      </div>
      <a href="#xz-lead" class="xz-btn xz-light sm">Book a demo</a>
      @if (session.signedIn()) {
        <div class="xz-usersel">
          <button type="button" class="xz-userbtn" (click)="toggleUserMenu($event)"
                  [attr.aria-expanded]="userMenuOpen()">
            <span class="xz-useri" aria-hidden="true">{{ session.initial() }}</span>
            <span class="xz-username">{{ session.displayName() }}</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="xz-regionmenu" [class.open]="userMenuOpen()" role="menu">
            <button type="button" role="menuitem" (click)="signOut()">Sign out</button>
          </div>
        </div>
      } @else {
        <a href="#" class="xz-btn xz-accent sm" [class.xz-busy]="auth.busyFor('chrome')"
           [attr.aria-busy]="auth.busyFor('chrome')" (click)="openAuth($event)">Sign in</a>
      }
      @if (auth.errorFor('chrome')) {
        <p class="xz-autherr" role="alert">{{ auth.errorFor('chrome') }}</p>
      }
    </div>
  </div>
</header>
