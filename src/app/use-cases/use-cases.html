<section id="usecases">
  <div class="wrap">
    <div class="sec-head center rv">
      <span class="eyebrow">One companion, all of it</span>
      <h2>Whatever the app used to be for —<br>it's <em>in here</em> now.</h2>
    </div>
    <div class="uc-tabs rv" data-d="1" role="tablist" aria-label="Use case">
      @for (useCase of useCases; track useCase.key) {
        <button class="uc-tab" [class.on]="useCase.key === activeKey()" role="tab" [attr.aria-selected]="useCase.key === activeKey()" (click)="select(useCase.key)">{{ useCase.label }}</button>
      }
    </div>
    <div class="uc-body rv" data-d="2" id="ucBody">
      <div>
        <h3>{{ active().heading }}</h3>
        <ul class="uc-list">
          @for (point of active().points; track point) {
            <li><span class="tk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>{{ point }}</li>
          }
        </ul>
        <a href="auth_v1.html" class="btn primary">Create your Double</a>
      </div>
      <div class="uc-visual">
        <div class="glyph">
          <svg viewBox="0 0 24 24">
            @switch (activeKey()) {
              @case ('insurance') {
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              }
              @case ('money') {
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 6v12M14.5 9.5A2.5 2.5 0 0 0 12 8c-1.4 0-2.5.9-2.5 2s1.1 2 2.5 2 2.5.9 2.5 2-1.1 2-2.5 2a2.5 2.5 0 0 1-2.5-1.5"/>
              }
              @case ('home') {
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              }
              @case ('health') {
                <path d="M20.8 6.6a5 5 0 0 0-7.1 0L12 8.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/>
              }
              @case ('family') {
                <circle cx="9" cy="8" r="3.2"/>
                <path d="M3 20a6 6 0 0 1 12 0"/>
                <circle cx="17.5" cy="9" r="2.6"/>
                <path d="M16 20a5.5 5.5 0 0 1 5.5-5.5"/>
              }
            }
          </svg>
        </div>
      </div>
    </div>
  </div>
</section>
